<!doctype html>
<meta charset="utf-8">
<title>Dog head labeler</title>
<style>
  html, body { margin: 0; height: 100%; display: flex; flex-direction: column; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  #bar { display: flex; gap: 16px; align-items: center; padding: 6px 12px; background: #1b1b1b; flex-wrap: wrap; }
  #bar b { color: #fff; } kbd { background: #333; border-radius: 3px; padding: 1px 5px; color: #fff; }
  #wrap { display: flex; flex: 1; min-height: 0; }
  #cv { flex: 1; min-width: 0; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #side { width: 210px; padding: 8px 12px; background: #181818; overflow: auto; }
  #side div { padding: 3px 4px; border-radius: 3px; cursor: pointer; display: flex; justify-content: space-between; }
  #side div.sel { background: #2c2c2c; } #side div.off { opacity: .45; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
</style>
<div id="bar">
  <span id="pos">loading</span>
  <span><kbd>Enter</kbd> accept</span><span><kbd>X</kbd> no dog</span><span><kbd>S</kbd> skip</span><span><kbd>B</kbd> back</span>
  <span>drag points / box corners</span><span><kbd>V</kbd>, right-click or double-click: toggle visible</span>
  <span><kbd>0</kbd>–<kbd>9</kbd> select, then click to place</span>
  <span id="msg" style="color:#fc6"></span>
</div>
<div id="wrap"><div id="cv"><canvas id="c"></canvas></div><div id="side"></div></div>
<script>
const COLORS = ["#ffd400","#00a2ff","#00a2ff","#4cd964","#4cd964","#2e8b3d","#2e8b3d","#d05cff","#999","#999"];
const OPTIONAL = [8, 9];
const c = document.getElementById("c"), g = c.getContext("2d"), side = document.getElementById("side");
let names = [], idx = 0, it = null, img = new Image(), sel = 0, drag = null, view = {s: 1, ox: 0, oy: 0}, review = false;

// template used when the model saw nothing: a face looking at the camera (dog's left is image right)
const TEMPLATE = [[.5,.62],[.6,.42],[.4,.42],[.68,.3],[.32,.3],[.74,.16],[.26,.16],[.5,.74],[.5,.85],[.5,.95]];

async function init() {
  const r = await (await fetch("/api/list")).json();
  names = r.names; review = r.review; idx = 0; load();
}
async function load() {
  if (idx >= names.length) { it = null; document.getElementById("pos").textContent = names.length ? "end of queue. Reload to see skipped frames." : "queue is empty"; draw(); return; }
  it = await (await fetch("/api/item?name=" + encodeURIComponent(names[idx]))).json();
  if (it.error) { names.splice(idx, 1); return load(); }      // already labeled and moved out of the queue
  if (!it.box) it.box = [.5, .5, .7, .8];
  if (!it.kpts) { const [cx, cy, w, h] = it.box; it.kpts = TEMPLATE.map(([x, y], i) => [cx + (x - .5) * w, cy + (y - .5) * h, OPTIONAL.includes(i) ? 0 : 2]); it.fresh = true; }
  it.kpts.forEach((k, i) => { if (!k[2] && !k[0] && !k[1]) { k[0] = it.box[0]; k[1] = it.box[1]; } });
  img = new Image(); img.onload = draw; img.src = "/img/" + encodeURIComponent(it.name);
  document.getElementById("pos").innerHTML = `<b>${idx + 1}</b> / ${names.length} ${review ? "(review)" : ""} &nbsp; ${it.name}`;
  document.getElementById("msg").textContent = it.fresh ? "no prediction: template placed, drag everything" : "";
  sel = 0; drawSide();
}
function drawSide() {
  side.innerHTML = "";
  if (!it) return;
  it.names.forEach((n, i) => {
    const d = document.createElement("div");
    d.className = (i === sel ? "sel " : "") + (it.kpts[i][2] ? "" : "off");
    const conf = it.conf ? it.conf[i].toFixed(2) : "";
    d.innerHTML = `<span><span class="dot" style="background:${COLORS[i]}"></span>${i} ${n}</span><span>${it.kpts[i][2] ? conf : "off"}</span>`;
    d.onclick = () => { sel = i; drawSide(); draw(); };
    d.ondblclick = () => toggle(i);
    side.appendChild(d);
  });
}
function fit() {
  const r = c.getBoundingClientRect(); c.width = r.width * devicePixelRatio; c.height = r.height * devicePixelRatio;
  if (!it || !img.width) return;
  view.s = Math.min(c.width / img.width, c.height / img.height) * .96;
  view.ox = (c.width - img.width * view.s) / 2; view.oy = (c.height - img.height * view.s) / 2;
}
const X = x => view.ox + x * img.width * view.s, Y = y => view.oy + y * img.height * view.s;
function corners() { const [cx, cy, w, h] = it.box; return [[cx - w / 2, cy - h / 2], [cx + w / 2, cy + h / 2]]; }
function draw() {
  fit(); g.clearRect(0, 0, c.width, c.height);
  if (!it || !img.width) return;
  g.drawImage(img, view.ox, view.oy, img.width * view.s, img.height * view.s);
  const [[x1, y1], [x2, y2]] = corners(), dpr = devicePixelRatio;
  g.strokeStyle = "#ffc800"; g.lineWidth = 2 * dpr; g.strokeRect(X(x1), Y(y1), X(x2) - X(x1), Y(y2) - Y(y1));
  g.fillStyle = "#ffc800"; for (const [x, y] of [[x1, y1], [x2, y2]]) g.fillRect(X(x) - 5 * dpr, Y(y) - 5 * dpr, 10 * dpr, 10 * dpr);
  it.kpts.forEach(([x, y, v], i) => {
    if (!v && OPTIONAL.includes(i) && i !== sel) return;
    g.beginPath(); g.arc(X(x), Y(y), (i === sel ? 8 : 6) * dpr, 0, 7);
    g.lineWidth = 2 * dpr; g.strokeStyle = COLORS[i]; g.fillStyle = COLORS[i];
    if (v) g.fill(); else { g.setLineDash([4 * dpr, 3 * dpr]); g.stroke(); g.setLineDash([]); }
    if (i === sel) { g.strokeStyle = "#fff"; g.stroke(); }
    g.fillStyle = "#fff"; g.font = `${12 * dpr}px system-ui`; g.fillText(i, X(x) + 9 * dpr, Y(y) - 7 * dpr);
  });
}
function toggle(i) { it.kpts[i][2] = it.kpts[i][2] ? 0 : 2; sel = i; drawSide(); draw(); }
function pos(e) { const r = c.getBoundingClientRect(); const px = (e.clientX - r.left) * devicePixelRatio, py = (e.clientY - r.top) * devicePixelRatio;
  return [px, py, Math.min(1, Math.max(0, (px - view.ox) / (img.width * view.s))), Math.min(1, Math.max(0, (py - view.oy) / (img.height * view.s)))]; }
function hit(px, py) {
  const R = 14 * devicePixelRatio; let best = null, bd = R;
  it.kpts.forEach(([x, y, v], i) => { if (!v && OPTIONAL.includes(i) && i !== sel) return; const d = Math.hypot(X(x) - px, Y(y) - py); if (d < bd) { bd = d; best = {k: i}; } });
  if (best) return best;
  corners().forEach(([x, y], i) => { const d = Math.hypot(X(x) - px, Y(y) - py); if (d < bd) { bd = d; best = {corner: i}; } });
  return best;
}
c.onpointerdown = e => {
  if (!it) return; const [px, py, nx, ny] = pos(e); const h = hit(px, py);
  if (e.button === 2) { if (h && h.k !== undefined) toggle(h.k); return; }
  if (h) { drag = h; if (h.k !== undefined) { sel = h.k; drawSide(); } }
  else { it.kpts[sel] = [nx, ny, 2]; drag = {k: sel}; drawSide(); }      // click empty space: place the selected point
  c.setPointerCapture(e.pointerId); draw();
};
c.onpointermove = e => {
  if (!drag || !it) return; const [, , nx, ny] = pos(e);
  if (drag.k !== undefined) { it.kpts[drag.k][0] = nx; it.kpts[drag.k][1] = ny; }
  else { const cs = corners(); cs[drag.corner] = [nx, ny];
    const x1 = Math.min(cs[0][0], cs[1][0]), x2 = Math.max(cs[0][0], cs[1][0]), y1 = Math.min(cs[0][1], cs[1][1]), y2 = Math.max(cs[0][1], cs[1][1]);
    it.box = [(x1 + x2) / 2, (y1 + y2) / 2, Math.max(.01, x2 - x1), Math.max(.01, y2 - y1)];
    if (cs[0][0] > cs[1][0] || cs[0][1] > cs[1][1]) drag = null; }
  draw();
};
c.onpointerup = () => drag = null;
c.ondblclick = e => { const [px, py] = pos(e); const h = hit(px, py); if (h && h.k !== undefined) toggle(h.k); };
c.oncontextmenu = e => e.preventDefault();
async function send(action) {
  if (!it) return;
  const r = await fetch("/api/save", {method: "POST", body: JSON.stringify({name: it.name, action, box: it.box, kpts: it.kpts})});
  if (!r.ok) { document.getElementById("msg").textContent = "save failed: " + (await r.text()); return; }
  idx++; load();
}
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === "enter") send("accept"); else if (k === "x") send("nodog");
  else if (k === "s") { idx++; load(); } else if (k === "b") { idx = Math.max(0, idx - 1); load(); }
  else if (k === "v") toggle(sel);
  else if (/^[0-9]$/.test(k)) { sel = +k; drawSide(); draw(); }
  else if (k === "tab") { e.preventDefault(); sel = (sel + 1) % 10; drawSide(); draw(); }
});
addEventListener("resize", draw);
init();
</script>
